name: probe rank cats

on:
  workflow_dispatch:
    inputs:
      missing_only:
        description: 'Chỉ ID chưa có (bỏ tích = kiểm lại toàn bộ, sửa gender cũ)'
        type: boolean
        default: false
      start:
        description: 'Category ID bắt đầu'
        default: '1'
      end:
        description: 'Category ID cuối (trống = toàn bộ file category)'
        default: ''
      auto_resume:
        description: 'Lưu và nghỉ 5 phút rồi chạy tiếp khi gặp 3 body rỗng'
        type: boolean
        default: true
      stalled_runs:
        description: 'Bộ đếm nội bộ: số lượt không tiến thêm'
        default: '0'

concurrency:
  group: newtomato-data-writes
  queue: max

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          path: app
      - uses: actions/checkout@v6
        with:
          ref: data
          path: snapshot
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Probe or revalidate categories and correct Rankcat genders
        env:
          RANKCAT_DATA_DIR: ${{ github.workspace }}/snapshot/data
          PROBE_START: ${{ inputs.start }}
          PROBE_END: ${{ inputs.end }}
          PROBE_MISSING_ONLY: ${{ inputs.missing_only }}
        run: node app/probe-rank-cats.js
      - name: Save discovered rank categories and progress
        if: '!cancelled()'
        working-directory: snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/valid_rank_cats.json
          if [ -f data/rankcat-probe-report.json ]; then
            git add data/rankcat-probe-report.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "data: discover additional valid rank categories"
            git pull --rebase origin data
            git push origin HEAD:data
          fi
      - name: Upload probe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rankcat-probe-results
          path: |
            snapshot/data/valid_rank_cats.json
            snapshot/data/rankcat-probe-report.json
          if-no-files-found: ignore
      - name: Decide whether to resume
        id: resume
        if: success() && inputs.auto_resume
        uses: actions/github-script@v8
        env:
          PROBE_START: ${{ inputs.start }}
          STALLED_RUNS: ${{ inputs.stalled_runs }}
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('snapshot/data/rankcat-probe-report.json', 'utf8'));
            if (report.stop_reason !== 'empty_body_streak') return;
            const start = report.resume_start;
            const previousStart = Number(process.env.PROBE_START || 1);
            const previousStalls = Number(process.env.STALLED_RUNS || 0);
            if (!Number.isSafeInteger(start) || start < previousStart || !Number.isSafeInteger(previousStalls) || previousStalls < 0) throw new Error('Invalid probe resume state');
            const stalled = start <= previousStart ? previousStalls + 1 : 0;
            if (stalled >= 3) {
              core.warning('Stopped after 3 runs without progress. Resume manually from category ' + start);
              await core.summary.addRaw('\nStopped after 3 runs without progress; manual resume from **' + start + '**.\n').write();
              return;
            }
            core.setOutput('start', start);
            core.setOutput('stalled_runs', stalled);
            await core.summary.addRaw('\nSaved to data branch; waiting 5 minutes before resuming from **' + start + '**.\n').write();
      - name: Cool down for 5 minutes
        if: steps.resume.outputs.start != ''
        run: sleep 300
      - name: Start next probe
        if: steps.resume.outputs.start != ''
        uses: actions/github-script@v8
        env:
          RESUME_START: ${{ steps.resume.outputs.start }}
          PROBE_END: ${{ inputs.end }}
          PROBE_MISSING_ONLY: ${{ inputs.missing_only }}
          STALLED_RUNS: ${{ steps.resume.outputs.stalled_runs }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'probe rank cats.yml',
              ref: 'main',
              inputs: {
                start: process.env.RESUME_START,
                end: process.env.PROBE_END || '',
                missing_only: process.env.PROBE_MISSING_ONLY,
                auto_resume: 'true',
                stalled_runs: process.env.STALLED_RUNS,
              },
            });
