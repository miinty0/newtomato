name: refetch-missing-details

on:
  schedule:
    - cron: '17 20 * * *' # 20:17 UTC = 03:17 giờ Việt Nam ngày hôm sau
  workflow_dispatch:
    inputs:
      file_filter:
        description: 'Chỉ xử lý 1 file cụ thể trong data. Bỏ trống = quét toàn bộ'
        required: false
        default: ''
      limit:
        description: 'Giới hạn số book_id xử lý trong lần chạy này (bỏ trống = không giới hạn)'
        required: false
        default: ''

concurrency:
  group: newtomato-data-writes
  queue: max

jobs:
  refetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'

      - name: restore data from data branch
        run: |
          git fetch origin data
          git checkout origin/data -- data/

      - name: run refetch script
        env:
          FILE_FILTER: ${{ inputs.file_filter }}
          LIMIT: ${{ inputs.limit }}
        shell: bash
        run: |
          args=()
          if [ -n "$FILE_FILTER" ]; then
            args+=(--file "$FILE_FILTER")
          fi
          if [ -n "$LIMIT" ]; then
            args+=(--limit "$LIMIT")
          fi
          node refetch-missing-details.js "${args[@]}"

      - name: cleanup newly fetched and existing books
        if: ${{ github.event_name == 'schedule' }}
        run: node cleanup-books.js --mode combined --year 2024 --data-dir ./data

      - name: save to data branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin data
          git worktree add /tmp/data-worktree origin/data

          # Mirror deletions too: cleanup may remove empty history snapshots.
          rsync -a --delete data/ /tmp/data-worktree/data/

          cd /tmp/data-worktree
          git add data/
          git diff --cached --quiet || git commit -m "refetch-missing-details $(date -u '+%Y-%m-%d %H:%M')"
          git push origin HEAD:data
