name: Scan Categories

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Category ID start'
        default: '1'
      end:
        description: 'Category ID end'
        default: '1000'

      missing_only:
        description: 'Chỉ kiểm tra ID còn thiếu (bổ sung vào categories_1-2000.json)'
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Run scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CAT_START: ${{ inputs.start }}
          CAT_END: ${{ inputs.end }}
          MISSING_ONLY: ${{ inputs.missing_only }}
        run: |
          args=("$CAT_START" "$CAT_END")
          if [ "$MISSING_ONLY" = "true" ]; then
            args+=(--missing-only)
          fi
          node scan-categories.js "${args[@]}" 2>&1 | tee result.txt
